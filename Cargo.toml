[package]
name = "ikigai-secret"
version = "0.5.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Secrets for ikigai (urn:secret:*): resolve and store secrets through the OS keystore, capability-gated. macOS Keychain backend on a Mac; a dev file backend elsewhere. The first slice of the pluggable secrets facade."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-secret"
homepage = "https://github.com/ikigai-rs/ikigai-secret"
keywords = ["ikigai", "roc", "secret", "keychain", "capability"]
categories = ["os"]

[dependencies]
# The kernel: Endpoint/Space/Capability/Error, and `config::data_home_from` for the file store's
# default directory. core 0.4 is scope opacity and structured denials (the core 0.4.0 cascade,
# ledger #3913): `Error::Denied` carries a `Denial`, built here with `.into()` from the same
# sentence as before. 0.4.1, not 0.4.0, because the test build's ikigai-resolve 0.6.0 requires
# `^0.4.1`, and one floor for both keeps a lockless resolve honest. Before it, 0.3.0 was the
# scoped content store (ledger #2965). ⚠ "0.4.1" is a caret floor that admits every 0.4.x and a
# CEILING below 0.5.
ikigai-core = "0.4.1"
# Endpoint::invoke is async (dyn via async-trait).
async-trait = "0.1"
# The `[secret]` section (ledger #4486) is `Deserialize`, as core's `CacheConfig` is: the host
# reads its config.toml and deserializes the table; this crate reads no file.
serde = { version = "1", features = ["derive"] }
# The inspection resources' `application/json` face.
serde_json = "1"
# A route's `match` is a glob on the full secret name (`*`, `?`, `[...]`): rust-lang's `glob`
# crate, no dependencies, rather than a matcher written here. `Pattern::new`/`matches` and the
# public `PatternError::msg` are 0.3 API.
glob = "0.3"

# Ed25519 key generation for `urn:secret:generate`. PKCS8 (private) + SPKI (public)
# PEM encoding — the same standard encodings ikigai-sign reads via `key=urn:secret:<name>`.
# Cross-platform (native); no wasm face needed for this module.
ed25519-dalek = { version = "2.1", default-features = false, features = [
    "std",
    "pkcs8",
    "pem",
    "rand_core",
] }
# OsRng for the key material (rand_core 0.6, the version ed25519-dalek 2.1 links).
rand_core = { version = "0.6", features = ["getrandom"] }

# `age` X25519 keygen for `urn:secret:generate type=age` — the ENCRYPTION keypair, dual of
# the ed25519 signing key, whose identity/recipient strings `ikigai-encrypt` consumes as
# `key=`/`to=`. Only the x25519 keygen is used (no armor/encrypt here), so default-features off.
age = { version = "0.11", default-features = false }
# The `age-file` store (ledger #4488) seals and opens each item through ikigai-encrypt's library,
# the ecosystem's ONE implementation of age (`ikigai_encrypt::age::{seal, open, parse_identities,
# parse_recipients}`, with its low-order recipient check and contained panics), rather than a
# second copy here. `default-features = false`: the library alone, no kernel endpoints, no armor
# (the store writes binary age), so it links neither ikigai-core nor async-trait through it.
# 0.5.0 is the release whose library is the `age` module above. ⚠ "0.5.0" is a CEILING too
# (<0.6.0).
ikigai-encrypt = { version = "0.5.0", default-features = false }

# The macOS Keychain backend (Security.framework generic passwords). Gated off other
# platforms, which fall back to the dev file store.
[target.'cfg(target_os = "macos")'.dependencies]
# OSX_10_15 unlocks the DATA-PROTECTION keychain, where Secure-Enclave keys must live to
# PERSIST and be findable again (a plain file-keychain generate is transient → the key vanishes
# before the next sign). Both the generate and the lookup select it.
security-framework = { version = "3", features = ["OSX_10_15"] }
# Touch ID for `urn:secret:unlock` / `require_biometric` (LocalAuthentication, sync).
# macOS-gated: off it, the gate is a no-op (a Mac-deployment property).
robius-authentication = "0.1"

# The file store's owner check: the effective uid its directory and files must belong to.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Resolver::issue_as drives the capability-gating test. 0.6.0 is the ikigai-resolve on
# ikigai-core 0.4 (the cascade, ledger #3913); an older resolve links an older core and would put
# a second core in the test build. ⚠ `^0.6.0` is a CEILING too (<0.7.0).
ikigai-resolve = "0.6.0"
futures = "0.3"
tempfile = "3"
# Test-only: the `[secret]` section is deserialized from real TOML in the tests and doctests, as a
# host would (`toml::from_str`). The library itself reads no TOML.
toml = "0.8"
# Test-only: `tests/fnox_plugin.rs` loads `contrib/fnox/ikigai.lua` into Lua 5.4 (the version
# fnox's plugins target), built from source by `vendored` so CI needs no system Lua, beside a
# stand-in for `fnox.cmd`. Never in the published library. ⚠ "0.12" is a CEILING too (<0.13).
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# The module recipe as one test (`tests/conformance.rs`): walks every bound endpoint and
# reports every violation at once. 0.12.0 adds BODIES (the buffered and body faces of an action
# agree; probed through `Suite::body_space`) and BODY-INPUTS (an argument declared `reads_body`
# takes inline, reference, stored and attached forms alike; nothing here declares one), both on by
# default (ledger #2587). 0.11.0 (ledger #2261) turned on DATATYPES and FAILURES. Under 0.x caret
# rules this pin is a CEILING too: "0.15.0" means <0.16.0, so a 0.16 needs a deliberate bump here.
# 0.15.0 is the release on ikigai-core 0.4 (the cascade, ledger #3913), so the test build links
# one core; 0.13.0 added the `race` probes, which run by default.
ikigai-conformance = "0.15.0"
# Test-only: round-trip the Enclave wire-form converters (DER↔r‖s, point↔SPKI) against p256's
# canonical encodings. A dev-dependency, so it never reaches the published crate or the wasm lib.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
