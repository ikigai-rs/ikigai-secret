[package]
name = "ikigai-secret"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Secrets for ikigai (urn:secret:*): resolve and store secrets through the OS keystore, capability-gated. macOS Keychain backend on a Mac; a dev file backend elsewhere. The first slice of the pluggable secrets facade."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-secret"
homepage = "https://github.com/ikigai-rs/ikigai-secret"
keywords = ["ikigai", "roc", "secret", "keychain", "capability"]
categories = ["os"]

[dependencies]
# The kernel: Endpoint/Space/Capability/Error, and `config::data_home_from` for the file store's
# default directory. 0.3.0 is the scoped content store (ledger #2965): held content is scoped
# to whoever delivered it, and ContentStore::put/put_replay are root-only. This crate calls
# neither, so it needed no source change. Before it, 0.2.0 was the streams release (ledger
# #2261). ⚠ "0.3.0" is a caret floor that admits every 0.3.x and a CEILING below 0.4.
ikigai-core = "0.3.0"
# Endpoint::invoke is async (dyn via async-trait).
async-trait = "0.1"

# Ed25519 key generation for `urn:secret:generate`. PKCS8 (private) + SPKI (public)
# PEM encoding — the same standard encodings ikigai-sign reads via `key=urn:secret:<name>`.
# Cross-platform (native); no wasm face needed for this module.
ed25519-dalek = { version = "2.1", default-features = false, features = [
    "std",
    "pkcs8",
    "pem",
    "rand_core",
] }
# OsRng for the key material (rand_core 0.6, the version ed25519-dalek 2.1 links).
rand_core = { version = "0.6", features = ["getrandom"] }

# `age` X25519 keygen for `urn:secret:generate type=age` — the ENCRYPTION keypair, dual of
# the ed25519 signing key, whose identity/recipient strings `ikigai-encrypt` consumes as
# `key=`/`to=`. Only the x25519 keygen is used (no armor/encrypt here), so default-features off.
age = { version = "0.11", default-features = false }

# The macOS Keychain backend (Security.framework generic passwords). Gated off other
# platforms, which fall back to the dev file store.
[target.'cfg(target_os = "macos")'.dependencies]
# OSX_10_15 unlocks the DATA-PROTECTION keychain, where Secure-Enclave keys must live to
# PERSIST and be findable again (a plain file-keychain generate is transient → the key vanishes
# before the next sign). Both the generate and the lookup select it.
security-framework = { version = "3", features = ["OSX_10_15"] }
# Touch ID for `urn:secret:unlock` / `require_biometric` (LocalAuthentication, sync).
# macOS-gated: off it, the gate is a no-op (a Mac-deployment property).
robius-authentication = "0.1"

# The file store's owner check: the effective uid its directory and files must belong to.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Resolver::issue_as drives the capability-gating test. 0.3.0 is the first ikigai-resolve on
# ikigai-core 0.3 (ledger #3061); an older resolve links an older core and would put a second
# core in the test build. ⚠ `^0.3.0` is a CEILING too (<0.4.0).
ikigai-resolve = "0.3.0"
futures = "0.3"
tempfile = "3"
# The module recipe as one test (`tests/conformance.rs`): walks every bound endpoint and
# reports every violation at once. 0.12.0 adds BODIES (the buffered and body faces of an action
# agree; probed through `Suite::body_space`) and BODY-INPUTS (an argument declared `reads_body`
# takes inline, reference, stored and attached forms alike; nothing here declares one), both on by
# default (ledger #2587). 0.11.0 (ledger #2261) turned on DATATYPES and FAILURES. Under 0.x caret
# rules this pin is a CEILING too: "0.14.0" means <0.15.0, so a 0.15 needs a deliberate bump here.
# 0.14.0 is the release on ikigai-core 0.3.0 (ledger #2965), so the test build links one core;
# 0.13.0 added the `race` probes, which run by default.
ikigai-conformance = "0.14.0"
# Test-only: round-trip the Enclave wire-form converters (DER↔r‖s, point↔SPKI) against p256's
# canonical encodings. A dev-dependency, so it never reaches the published crate or the wasm lib.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
