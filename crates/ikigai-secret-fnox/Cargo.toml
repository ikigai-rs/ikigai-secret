[package]
name = "ikigai-secret-fnox"
version = "0.1.0"
edition = "2021"
# fnox-core 1.50.0 declares rust-version 1.91.1 (it is edition 2024), so nothing older can build
# this crate. CI's msrv job reads the highest rust-version in the workspace and runs clippy and
# the tests on it, for ikigai-secret too.
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
description = "A read-only fnox store for ikigai-secret: secrets read through fnox's library from one fnox configuration file, names mapped one to one, never interactive. A host-role connector."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-secret"
keywords = ["ikigai", "secret", "fnox", "capability"]
categories = ["os"]
readme = "README.md"

[features]
# fnox's provider families whose SDKs are large, each opt-in, so a host builds only the providers
# it uses. Every other fnox provider (age, plain, 1Password, Bitwarden, Vault, the OS keychain,
# password-store and the rest) is in the base build. The names are fnox's own.
default = []
aws = ["fnox-core/aws"]
azure = ["fnox-core/azure"]
gcp = ["fnox-core/gcp"]
keeper = ["fnox-core/keeper"]
kubernetes = ["fnox-core/kubernetes"]
enpass = ["fnox-core/enpass"]
fido2 = ["fnox-core/fido2"]

[dependencies]
# The `Backend` trait, the checked `[secret]` section (`StoreKind::Fnox`, `FnoxNames`) and the
# read-only refusal. 0.5.4 is the release that accepts the `fnox` kind. ⚠ "0.5.4" is a CEILING
# too (<0.6.0). The path is the workspace sibling; the version is what a published copy needs.
ikigai-secret = { path = "../..", version = "0.5.4" }
# `Error` and `Result`, the types the `Backend` trait speaks. ⚠ A ceiling too (<0.5.0).
ikigai-core = "0.4.1"
# fnox's library (`library::Fnox`: `open`, `with_profiles`, `get`, `list`) lives in fnox-core;
# the `fnox` crate re-exports it beside the whole command-line program (a terminal UI, an MCP
# server, a clipboard, an HTTP proxy), none of which a store needs. Its default features pull the
# AWS, Azure, GCP, Keeper, Kubernetes, Enpass and FIDO2 SDKs, so they are off here and offered as
# this crate's features above. ⚠ "1.50.0" admits every 1.x: the library is fnox's "first cut", so
# a later minor could change it; the tests here are what would notice.
fnox-core = { version = "1.50.0", default-features = false }
# A current-thread runtime per read: `Backend` is synchronous and fnox's `get` is async, and a
# host calls the backend from inside its own runtime, where blocking on another future would
# panic. fnox-core turns on tokio's other features itself.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# Test-only: the fixture's age identity and its sealed values, in the age format fnox's `age`
# provider reads. 0.12 is the version fnox-core links, so it adds nothing to the build.
age = "0.12"
tempfile = "3"
toml = "0.8"
# The routed space, driven through a kernel as a host would, to show a refused caller never
# reaches fnox.
futures = "0.3"
